# A simple configuration file to run Particle Gun Monte Carlo in comet
# In this case muons are fired straight into the detector solenoid.

# To get help for a command use RunIcedustControl --command=""

[configuration]
# The modules we'll be running
module_list = SimG4 
output_directory= %(SH_OUTPUT)
#inputfile = %(SH_INPUT)

[filenaming]
# Some metadata about the run
run_number = %(SH_RUN)
subrun = %(SH_SUBRUN)

[SimG4]
# Produce 100000 events generated from the RooTracker file
#num_events = 100000
## Particle generator mode
#primary_mode = rootracker
## Name of the TTree inside the RooTracker file
#rootracker_tree = RooTrackerTree
## Source of the RooTracker file
#rootracker_source = SimG4
## Add the fake geantino to each event
#fake_geantino = False

num_events = 50000
primary_mode = gun
primary_particle = e-
#primary_particle = mu-
#primary_particle = pi-
primary_position = Disk 540 0 765 10 cm +x
primary_energy = Mono 104.49
#primary_energy = Flat 19.51 119.49 #e-
#primary_energy = Flat 1.88 61.35 #mu-
#primary_energy = Flat 1.51 43.92 #pi-
primary_direction = Cone +x 0 10

# Random number generator seed
random_seed = %(SH_RANDOM_SEED)

# Save only trajectories that leave hits
traj_saveall = True
# Save every single point from all trajectories
traj_default_saveNthPoint = 1
## Setup the rootracker file
#init_rootracker = False
## Events with no primaries will not be simulated
#empty_event = False
## Empty event will not be stored
#skip_save_empty_event = True

#Customize the ECAL position for geometry scanning
custom_PreInit=
    /comet/ecalsim/enableSaturation true

[geometry]
# Run with the Phase-I world with the Cylindrical Detector
world=Phase-I-StrECAL-BeamMeasure
#world=Phase-I-StrECAL-BeamMeasureWithTOFWithBB

[fieldmap]
# Now we get the map specified by the ICEDUST_FIELDMAPS
# environment variable. Source your 'enable.sh' script!
source=%(ICEDUST_FIELDMAPS)
